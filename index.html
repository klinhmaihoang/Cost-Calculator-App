<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Tính Cost & Giá Bán — Trương Dáng Hương Academy</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --cream:#FBF6EC;
    --cream-deep:#F3EAD6;
    --card:#FFFFFF;
    --line:#ECE0C6;
    --amber:#F0A319;
    --amber-deep:#C97F0A;
    --ink:#33281A;
    --ink-soft:#6B5E4B;
    --good:#4C7A3D;
    --good-bg:#E9F1E4;
    --warn:#B5482E;
    --warn-bg:#FBEAE4;
    --plum:#6A3D9A;
    --serif: Georgia, 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);font-family:var(--sans);}
  body{min-height:100vh;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--cream);display:flex;flex-direction:column;position:relative;}

  /* ---- top bar ---- */
  .topbar{padding:18px 20px 14px;background:var(--cream);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;}
  .topbar .brand{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--ink);}
  .topbar .brand span{color:var(--amber-deep);}
  .sync-pill{font-size:11px;color:var(--ink-soft);background:var(--cream-deep);border:1px solid var(--line);border-radius:20px;padding:4px 10px;white-space:nowrap;}

  .screen{padding:20px 20px 90px;flex:1;}
  h1.page-title{font-family:var(--serif);font-size:26px;margin:4px 0 6px;color:var(--ink);}
  p.page-sub{font-size:15px;color:var(--ink-soft);margin:0 0 20px;line-height:1.5;}

  /* ---- buttons ---- */
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px 18px;border-radius:14px;border:none;font-size:17px;font-weight:600;font-family:var(--sans);cursor:pointer;transition:transform .08s ease;}
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--amber);color:#2A1D02;}
  .btn-primary:hover{background:var(--amber-deep);}
  .btn-outline{background:var(--card);color:var(--ink);border:2px solid var(--line);}
  .btn-outline:hover{border-color:var(--amber);}
  .btn-ghost{background:transparent;color:var(--ink-soft);font-weight:500;padding:12px;}
  .btn-danger{background:var(--warn-bg);color:var(--warn);}
  .btn-sm{padding:10px 14px;font-size:14px;border-radius:10px;width:auto;}
  .btn-row{display:flex;gap:10px;margin-top:10px;}
  .btn-row .btn{flex:1;}

  /* ---- cards ---- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px;}
  .card-tap{cursor:pointer;}
  .card-tap:hover{border-color:var(--amber);}
  .card-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .card-title{font-size:17px;font-weight:700;color:var(--ink);}
  .card-sub{font-size:13.5px;color:var(--ink-soft);margin-top:2px;}
  .card-value{font-size:17px;font-weight:700;color:var(--amber-deep);white-space:nowrap;}

  .home-tile{display:flex;align-items:center;gap:14px;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;cursor:pointer;text-align:left;width:100%;}
  .home-tile:hover{border-color:var(--amber);}
  .home-tile .icon{font-size:26px;font-weight:700;width:46px;text-align:center;color:var(--amber-deep);}
  .home-tile.highlight .icon{color:#2A1D02;}
  .home-tile .txt .t{font-size:17px;font-weight:700;color:var(--ink);}
  .home-tile .txt .s{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .home-tile.highlight{background:linear-gradient(135deg,#F0A319,#D68A0C);border:none;}
  .home-tile.highlight .txt .t, .home-tile.highlight .txt .s{color:#2A1D02;}
  .home-tile.highlight .txt .s{color:#4a3510;}

  /* ---- form ---- */
  label{display:block;font-size:14px;font-weight:600;color:var(--ink);margin:16px 0 6px;}
  label:first-child{margin-top:0;}
  input[type=text], input[type=number], input[type=password], select{
    width:100%;padding:14px 14px;border:2px solid var(--line);border-radius:12px;font-size:16px;font-family:var(--sans);background:var(--card);color:var(--ink);
  }
  input:focus, select:focus{outline:none;border-color:var(--amber);}
  .hint{font-size:12.5px;color:var(--ink-soft);margin-top:5px;}
  .unit-badge{display:inline-block;background:var(--cream-deep);border:1px solid var(--line);color:var(--ink-soft);font-size:13px;padding:6px 12px;border-radius:10px;margin-top:6px;}

  /* ---- wizard progress: filling cup ---- */
  .wizard-head{display:flex;align-items:center;gap:16px;margin-bottom:8px;}
  .cup{width:40px;height:48px;flex-shrink:0;}
  .steps-row{display:flex;gap:6px;flex:1;}
  .step-dot{flex:1;height:6px;border-radius:4px;background:var(--line);}
  .step-dot.done{background:var(--amber);}
  .step-label{font-size:13px;color:var(--ink-soft);margin-bottom:18px;}

  /* ---- component list rows ---- */
  .comp-row{display:flex;align-items:center;justify-content:space-between;background:var(--cream-deep);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
  .comp-row .info .n{font-weight:700;font-size:15px;}
  .comp-row .info .m{font-size:13px;color:var(--ink-soft);}
  .comp-row .remove{background:none;border:none;color:var(--warn);font-size:20px;cursor:pointer;padding:4px 8px;}

  /* ---- breakdown bar ---- */
  .breakdown-bar{display:flex;height:22px;border-radius:8px;overflow:hidden;margin:14px 0;border:1px solid var(--line);}
  .legend{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;}
  .legend .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle;}

  .price-hero{background:var(--card);border:2px solid var(--amber);border-radius:18px;padding:22px;text-align:center;margin:14px 0 18px;}
  .price-hero .lbl{font-size:14px;color:var(--ink-soft);}
  .price-hero .val{font-family:var(--serif);font-size:38px;font-weight:700;color:var(--amber-deep);margin:6px 0;}
  .fc-badge{display:inline-block;font-size:13px;font-weight:700;padding:5px 12px;border-radius:20px;}
  .fc-good{background:var(--good-bg);color:var(--good);}
  .fc-warn{background:var(--warn-bg);color:var(--warn);}

  .empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .empty-state .big{font-size:40px;margin-bottom:10px;}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:30px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:50;opacity:0;transition:opacity .25s ease;pointer-events:none;}
  .toast.show{opacity:1;}

  .login-wrap{padding:60px 24px 40px;text-align:center;}
  .login-cup{width:70px;height:84px;margin:0 auto 18px;}
  .login-wrap h1{font-family:var(--serif);font-size:28px;margin:0 0 6px;}
  .login-wrap p{color:var(--ink-soft);font-size:15px;margin:0 0 34px;line-height:1.5;}
  .divider{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--ink-soft);font-size:13px;}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line);}
  .login-form{text-align:left;}

  .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .g-select{padding:14px;border:2px solid var(--line);border-radius:12px;font-size:15px;background:var(--card);}

  .full-loading{position:fixed;inset:0;background:rgba(251,246,236,.94);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
  .spinner{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--amber);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .full-loading-text{font-size:15px;color:var(--ink-soft);}
  .demo-banner{background:#FDF3DC;border:1px solid #E7C775;color:#7A5B0A;font-size:12.5px;padding:10px 14px;border-radius:12px;margin:0 0 22px;text-align:left;line-height:1.5;}
  .icon-btn{background:var(--cream-deep);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .icon-btn:active{transform:scale(.94);}
  .icon-btn-danger{background:var(--warn-bg);}
  .card-actions{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .card-actions-row{display:flex;gap:6px;}
  .select-check{width:24px;height:24px;margin-right:12px;flex-shrink:0;accent-color:var(--amber);}
  .list-tools{display:flex;gap:10px;margin-bottom:16px;}
  .list-tools .btn{flex:1;}
  .select-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 -4px 16px rgba(0,0,0,.1);z-index:20;}
  .select-bar .count{font-size:14px;font-weight:600;color:var(--ink);}
  .select-bar .actions{display:flex;gap:8px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="fullLoading" class="full-loading" style="display:none;">
  <div class="spinner"></div>
  <div id="fullLoadingText" class="full-loading-text">Đang tải...</div>
  <div id="fullLoadingCancel" style="display:none;">
    <button class="btn btn-ghost btn-sm" onclick="cancelRestore()">Bỏ qua, vào màn đăng nhập</button>
  </div>
</div>

<script>
/* =========================================================
   CONFIG — dán 2 giá trị này sau khi bạn setup Google Cloud +
   Apps Script (xem file SETUP.md đi kèm). Khi còn để mặc định,
   app tự chạy ở CHẾ ĐỘ DEMO (dữ liệu chỉ ở bộ nhớ tạm).
========================================================= */
const GOOGLE_CLIENT_ID = '759653073655-rpjlc12fufopt3et47k8qkv7u8eq9ql1.apps.googleusercontent.com';
const APPS_SCRIPT_URL  = 'https://script.google.com/macros/s/AKfycbw9r0HHYlPL2HmInl__1nX8ITibm_RQAQ3Vj3ZBdDbRzkfR1D4-ktUHRI2iEMAA_ndU/exec';
const GOOGLE_DEMO = GOOGLE_CLIENT_ID.startsWith('DÁN_');
const MHKL_DEMO = APPS_SCRIPT_URL.startsWith('DÁN_');
const DEMO_MODE = GOOGLE_DEMO && MHKL_DEMO; // chỉ true khi CẢ HAI chưa nối

/* =========================================================
   CLOUD SYNC LAYER
   - Học viên đăng nhập Google  -> ghi/đọc trực tiếp Google Sheet
     nằm trong Drive riêng của họ (Sheets API, scope drive.file).
   - Học viên dùng mã MHKL cấp  -> gọi Apps Script Web App, Apps
     Script tự tạo/đọc/ghi Sheet riêng cho học viên đó trong Drive
     của MHKL, có kiểm tra mật khẩu trước khi trả dữ liệu.
========================================================= */
const TABS = {
  Ingredients: ['id','name','group','buyUnit','packQty','baseUnit','price'],
  SemiRecipes: ['id','name','yieldQty','yieldUnit'],
  SemiComponents: ['id','semiId','ingredientId','semiName','ingredientName','qty','unitPrice','unit'],
  Dishes: ['id','name','opPct','fcPct','cost','suggestedPrice','actualFcPct'],
  DishComponents: ['id','dishId','refId','type','dishName','componentName','typeLabel','qty','unitPrice','unit'],
};

// Tên cột hiển thị bằng tiếng Việt — chỉ dùng để GHI dòng tiêu đề cho đẹp/dễ đọc.
// Đọc/ghi dữ liệu thật luôn dựa theo THỨ TỰ CỘT trong TABS (không dựa vào chữ hiển
// thị), nên đổi chữ ở đây không bao giờ làm hỏng dữ liệu — kể cả Sheet cũ đã tạo
// trước khi có bản cập nhật này cũng tự nâng cấp ở lần đồng bộ tiếp theo.
const VI_HEADERS = {
  Ingredients: ['Mã','Tên nguyên liệu','Nhóm','Quy cách mua','Số lượng/quy cách','Đơn vị tính','Giá mua (VNĐ)'],
  SemiRecipes: ['Mã','Tên bán thành phẩm','Sản lượng','Đơn vị sản lượng'],
  SemiComponents: ['Mã','Mã bán thành phẩm','Mã nguyên liệu','Tên bán thành phẩm','Tên nguyên liệu','Định mức','Đơn giá','Đơn vị tính'],
  Dishes: ['Mã','Tên món','% Chi phí vận hành','% Food cost mục tiêu','Chi phí nguyên liệu','Giá bán đề xuất','% Food cost thực tế'],
  DishComponents: ['Mã','Mã món','Mã thành phần','Loại (mã hệ thống)','Tên món','Tên thành phần','Loại','Định mức','Đơn giá','Đơn vị tính'],
};
const CURRENCY_COLS = { Ingredients: [7], SemiComponents: [7], DishComponents: [9], Dishes: [5, 6] };
const PERCENT_COLS = { Dishes: [3, 4, 7] };
const TAB_TITLES = {
  Ingredients: 'Nguyên liệu',
  SemiRecipes: 'Công thức nền',
  SemiComponents: 'Chi tiết công thức nền',
  Dishes: 'Món',
  DishComponents: 'Chi tiết món',
};

let accessToken = null;   // token OAuth của học viên đăng nhập Google
let tokenClient = null;

function showFullLoading(text, showCancel){
  document.getElementById('fullLoadingText').textContent = text;
  document.getElementById('fullLoading').style.display = 'flex';
  document.getElementById('fullLoadingCancel').style.display = showCancel ? 'block' : 'none';
}
function hideFullLoading(){ document.getElementById('fullLoading').style.display = 'none'; }
function cancelRestore(){
  if(window.__restoreTimeout){ clearTimeout(window.__restoreTimeout); window.__restoreTimeout = null; }
  isAutoRestoring = false;
  clearSessionCache();
  hideFullLoading();
  render();
}

/* ---- chuyển đổi state (dạng lồng nhau) <-> tabs (dạng bảng phẳng) ---- */
function stateToTabs(){
  return {
    Ingredients: state.ingredients.map(i=>({id:i.id,name:i.name,group:i.group,buyUnit:i.buyUnit,packQty:i.packQty,baseUnit:i.baseUnit,price:i.price})),
    SemiRecipes: state.semiRecipes.map(s=>({id:s.id,name:s.name,yieldQty:s.yieldQty,yieldUnit:s.yieldUnit})),
    SemiComponents: state.semiRecipes.flatMap(s=>s.components.map((c,idx)=>{
      const ing = findIngredient(c.ingredientId);
      return {
        id:s.id+'_c'+idx, semiId:s.id, ingredientId:c.ingredientId,
        semiName:s.name, ingredientName: ing?ing.name:'(đã xoá)',
        qty:c.qty, unitPrice: ing?ingredientUnitPrice(ing):0, unit: ing?ing.baseUnit:''
      };
    })),
    Dishes: state.dishes.map(d=>({
      id:d.id, name:d.name, opPct:d.opPct, fcPct:d.fcPct,
      cost: dishCost(d), suggestedPrice: suggestedPrice(d), actualFcPct: actualFoodCostPct(d)
    })),
    DishComponents: state.dishes.flatMap(d=>d.components.map((c,idx)=>({
      id:d.id+'_c'+idx, dishId:d.id, refId:c.refId, type:c.type,
      dishName:d.name, componentName: componentName(c), typeLabel: c.type==='semi' ? 'Bán thành phẩm' : 'Nguyên liệu thô',
      qty:c.qty, unitPrice: componentUnitPrice(c), unit: componentUnit(c)
    }))),
  };
}
function tabsToState(tabs){
  state.ingredients = (tabs.Ingredients||[]).map(r=>({id:String(r.id), name:r.name, group:r.group, buyUnit:r.buyUnit, packQty:Number(r.packQty), baseUnit:r.baseUnit, price:Number(r.price)}));
  const semiComps = {};
  (tabs.SemiComponents||[]).forEach(r=>{ (semiComps[r.semiId] = semiComps[r.semiId]||[]).push({ingredientId:String(r.ingredientId), qty:Number(r.qty)}); });
  state.semiRecipes = (tabs.SemiRecipes||[]).map(r=>({id:String(r.id), name:r.name, yieldQty:Number(r.yieldQty), yieldUnit:r.yieldUnit, components: semiComps[r.id]||[]}));
  const dishComps = {};
  (tabs.DishComponents||[]).forEach(r=>{ (dishComps[r.dishId] = dishComps[r.dishId]||[]).push({type:r.type, refId:String(r.refId), qty:Number(r.qty)}); });
  state.dishes = (tabs.Dishes||[]).map(r=>({id:String(r.id), name:r.name, opPct:Number(r.opPct), fcPct:Number(r.fcPct), components: dishComps[r.id]||[]}));
}

/* ---- lưu phiên đăng nhập để khỏi phải đăng nhập lại mỗi khi tải lại trang ----
   Lưu ý: tính năng này cần trình duyệt hỗ trợ localStorage — sẽ hoạt động
   bình thường khi mở app trên trang đã host (GitHub Pages...), nhưng có thể
   không lưu được nếu đang xem thử ngay trong khung xem trước của Claude. */
const SESSION_KEY = 'tdh_costapp_session';
function saveSessionCache(){
  if(!state.user) return;
  try{
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      method: state.user.method, name: state.user.name,
      sheetId: state.user.sheetId || null, token: state.user.token || null,
    }));
  }catch(e){}
}
function clearSessionCache(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }
function loadSessionCache(){
  try{ const raw = localStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function logout(){
  clearSessionCache();
  state.user = null;
  accessToken = null;
  toast('👋 Đã đăng xuất');
  go('login');
}
let isAutoRestoring = false;

/* ---- luồng Google (client-side, Sheets API trực tiếp) ---- */
function initGoogleAuth(){
  if(GOOGLE_DEMO || !window.google) return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/drive.file email profile',
    callback: async (resp)=>{
      if(window.__restoreTimeout){ clearTimeout(window.__restoreTimeout); window.__restoreTimeout = null; }
      state.pendingGoogleRestore = null;
      if(resp.error){
        hideFullLoading();
        toast('⚠️ Đăng nhập Google thất bại hoặc đã huỷ');
        render();
        return;
      }
      accessToken = resp.access_token;
      await afterGoogleLogin();
    }
  });
}
function loginWithGoogle(){
  if(GOOGLE_DEMO){ mockLogin('google'); return; }
  tokenClient.requestAccessToken();
}
async function findAppSpreadsheet(){
  const q = encodeURIComponent("appProperties has { key='app' and value='tdh_cost_app' } and trashed=false");
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`, {headers:{Authorization:'Bearer '+accessToken}});
  const json = await res.json();
  return (json.files && json.files[0]) ? json.files[0].id : null;
}
async function createAppSpreadsheet(){
  const body = { properties:{title:'CostApp - Dữ liệu của tôi'}, sheets: Object.keys(TABS).map(key=>({properties:{title:TAB_TITLES[key]}})) };
  const res = await fetch('https://sheets.googleapis.com/v4/spreadsheets', {
    method:'POST', headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'}, body:JSON.stringify(body)
  });
  const json = await res.json();
  const sheetId = json.spreadsheetId;
  await writeAllTabs(sheetId, stateToTabs()); // ghi sẵn data mẫu làm điểm khởi đầu
  await fetch(`https://www.googleapis.com/drive/v3/files/${sheetId}?fields=id`, {
    method:'PATCH', headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},
    body: JSON.stringify({appProperties:{app:'tdh_cost_app'}})
  });
  return sheetId;
}
async function ensureTabTitles(spreadsheetId){
  const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}?fields=sheets.properties`, {headers:{Authorization:'Bearer '+accessToken}});
  const json = await res.json();
  const byTitle = {};
  (json.sheets||[]).forEach(s=>{ byTitle[s.properties.title] = s.properties.sheetId; });
  const requests = [];
  Object.keys(TABS).forEach(key=>{
    const niceName = TAB_TITLES[key];
    if(byTitle[niceName] !== undefined) return; // đã đúng tên mới
    const sid = byTitle[key]; // Sheet cũ còn tên tiếng Anh
    if(sid !== undefined) requests.push({updateSheetProperties:{properties:{sheetId:sid, title:niceName}, fields:'title'}});
  });
  if(requests.length){
    await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}:batchUpdate`, {
      method:'POST', headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},
      body: JSON.stringify({requests})
    });
  }
}
async function writeAllTabs(sheetId, dataByTab){
  await ensureTabTitles(sheetId); // tự đổi tên tab cũ (tiếng Anh) sang tiếng Việt nếu cần
  // Xoá sạch từng tab trước khi ghi lại — nếu không, các dòng cũ (VD nguyên liệu
  // vừa bị xoá trong app) sẽ vẫn còn sót lại trên Sheet thật vì batchUpdate chỉ
  // ghi đè đúng số dòng của dữ liệu mới, không tự dọn phần thừa bên dưới.
  const clearRanges = Object.keys(TABS).map(t=>`${TAB_TITLES[t]}!A1:Z10000`);
  await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values:batchClear`, {
    method:'POST', headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},
    body: JSON.stringify({ranges: clearRanges})
  });
  const data = Object.keys(TABS).map(tab=>{
    const keys = TABS[tab];
    const headers = VI_HEADERS[tab] || keys;
    const rows = (dataByTab[tab]||[]).map(obj=>keys.map(k=> obj[k]===undefined?'':obj[k]));
    return {range: `${TAB_TITLES[tab]}!A1`, values:[headers, ...rows]};
  });
  await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values:batchUpdate`, {
    method:'POST', headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},
    body: JSON.stringify({valueInputOption:'RAW', data})
  });
  try{ await applySheetStyling(sheetId); }catch(e){ console.error('style error', e); } // không chặn lưu nếu style lỗi
}
async function readAllTabs(sheetId){
  await ensureTabTitles(sheetId); // tự đổi tên tab cũ nếu cần, trước khi đọc theo tên mới
  const rangeParams = Object.keys(TABS).map(t=>`ranges=${encodeURIComponent(TAB_TITLES[t]+'!A1:Z')}`).join('&');
  const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values:batchGet?${rangeParams}`, {headers:{Authorization:'Bearer '+accessToken}});
  const json = await res.json();
  const out = {};
  Object.keys(TABS).forEach((tab,i)=>{
    const values = (json.valueRanges[i] && json.valueRanges[i].values) || [];
    const keys = TABS[tab]; // đọc theo THỨ TỰ CỘT cố định, không phụ thuộc chữ ở dòng tiêu đề
    out[tab] = values.slice(1).map(r=>{ const o={}; keys.forEach((k,idx)=>o[k]=r[idx]); return o; });
  });
  return out;
}

/* ---- style Sheet: header tô màu, đóng băng dòng 1, định dạng tiền/% ---- */
async function getSheetIdMap(spreadsheetId){
  const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}?fields=sheets.properties`, {headers:{Authorization:'Bearer '+accessToken}});
  const json = await res.json();
  const map = {};
  (json.sheets||[]).forEach(s=>{ map[s.properties.title] = s.properties.sheetId; });
  return map;
}
function buildStyleRequests(sheetIdMap){
  const requests = [];
  Object.keys(TABS).forEach(tab=>{
    const sid = sheetIdMap[TAB_TITLES[tab]];
    if(sid===undefined) return;
    const headers = VI_HEADERS[tab] || TABS[tab];
    requests.push({updateSheetProperties:{properties:{sheetId:sid, gridProperties:{frozenRowCount:1}}, fields:'gridProperties.frozenRowCount'}});
    requests.push({repeatCell:{
      range:{sheetId:sid, startRowIndex:0, endRowIndex:1, startColumnIndex:0, endColumnIndex:headers.length},
      cell:{userEnteredFormat:{backgroundColor:{red:0.941,green:0.639,blue:0.098}, textFormat:{bold:true, foregroundColor:{red:0.165,green:0.114,blue:0.008}}, horizontalAlignment:'CENTER'}},
      fields:'userEnteredFormat(backgroundColor,textFormat,horizontalAlignment)'
    }});
    requests.push({updateDimensionProperties:{range:{sheetId:sid, dimension:'COLUMNS', startIndex:0, endIndex:headers.length}, properties:{pixelSize:160}, fields:'pixelSize'}});
    (CURRENCY_COLS[tab]||[]).forEach(c=>{
      requests.push({repeatCell:{
        range:{sheetId:sid, startRowIndex:1, endRowIndex:2000, startColumnIndex:c-1, endColumnIndex:c},
        cell:{userEnteredFormat:{numberFormat:{type:'CURRENCY', pattern:'#,##0" đ"'}}},
        fields:'userEnteredFormat.numberFormat'
      }});
    });
    (PERCENT_COLS[tab]||[]).forEach(c=>{
      requests.push({repeatCell:{
        range:{sheetId:sid, startRowIndex:1, endRowIndex:2000, startColumnIndex:c-1, endColumnIndex:c},
        cell:{userEnteredFormat:{numberFormat:{type:'PERCENT', pattern:'0.0%'}}},
        fields:'userEnteredFormat.numberFormat'
      }});
    });
  });
  return requests;
}
async function applySheetStyling(spreadsheetId){
  const sheetIdMap = await getSheetIdMap(spreadsheetId);
  const requests = buildStyleRequests(sheetIdMap);
  if(!requests.length) return;
  await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}:batchUpdate`, {
    method:'POST', headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},
    body: JSON.stringify({requests})
  });
}

function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout')), ms))
  ]);
}
async function tryRestoreSession(){
  const cached = loadSessionCache();
  if(!cached){ render(); return; }

  if(cached.method==='mhkl'){
    if(MHKL_DEMO){ render(); return; }
    showFullLoading('Đang khôi phục phiên đăng nhập...', true);
    try{
      const loadRes = await withTimeout(callAppsScript({action:'load', token: cached.token}), 8000);
      if(loadRes.ok){
        state.user = {name:cached.name, method:'mhkl', token:cached.token};
        tabsToState(loadRes.data);
        hideFullLoading();
        go('home');
        return;
      }
    }catch(e){}
    hideFullLoading();
    clearSessionCache();
    render();
    return;
  }

  if(cached.method==='google'){
    if(GOOGLE_DEMO || !tokenClient){ render(); return; }
    // Trình duyệt hiện đại chặn cookie bên thứ 3 nên không thể lấy lại quyền truy cập
    // Google hoàn toàn im lặng một cách đáng tin cậy. Thay vào đó: hiện sẵn màn "chào
    // mừng trở lại" — học viên chỉ cần CHẠM 1 CÁI, không cần gõ lại gì.
    state.pendingGoogleRestore = cached;
    render();
    return;
  }

  render();
}

/* ---------- calculation helpers ---------- */
function ingredientUnitPrice(ing){ return ing.packQty ? ing.price / ing.packQty : 0; }
function findIngredient(id){ return state.ingredients.find(x=>x.id===id); }
function findSemi(id){ return state.semiRecipes.find(x=>x.id===id); }

function semiTotalCost(semi){
  return semi.components.reduce((sum,c)=>{
    const ing = findIngredient(c.ingredientId);
    return sum + (ing ? c.qty * ingredientUnitPrice(ing) : 0);
  },0);
}
function semiUnitPrice(semi){ return semi.yieldQty ? semiTotalCost(semi)/semi.yieldQty : 0; }

function componentUnitPrice(c){
  if(c.type==='ingredient'){ const ing=findIngredient(c.refId); return ing?ingredientUnitPrice(ing):0; }
  const semi=findSemi(c.refId); return semi?semiUnitPrice(semi):0;
}
function componentUnit(c){
  if(c.type==='ingredient'){ const ing=findIngredient(c.refId); return ing?ing.baseUnit:''; }
  const semi=findSemi(c.refId); return semi?semi.yieldUnit:'';
}
function componentGroup(c){
  if(c.type==='ingredient'){ const ing=findIngredient(c.refId); return ing?ing.group:'Khác'; }
  return 'Bán thành phẩm';
}
function componentName(c){
  if(c.type==='ingredient'){ const ing=findIngredient(c.refId); return ing?ing.name:'(đã xoá)'; }
  const semi=findSemi(c.refId); return semi?semi.name:'(đã xoá)';
}
function dishCost(dish){
  return dish.components.reduce((sum,c)=>sum + c.qty*componentUnitPrice(c),0);
}
function dishBreakdown(dish){
  const groups = {};
  dish.components.forEach(c=>{
    const g = componentGroup(c);
    groups[g] = (groups[g]||0) + c.qty*componentUnitPrice(c);
  });
  return groups;
}
function suggestedPrice(dish){
  const cost = dishCost(dish) * (1 + dish.opPct);
  if(!dish.fcPct) return 0;
  return Math.round((cost/dish.fcPct)/1000)*1000;
}
function actualFoodCostPct(dish){
  const price = suggestedPrice(dish);
  if(!price) return 0;
  return dishCost(dish)*(1+dish.opPct) / price;
}
function fmtVND(n){ return Math.round(n).toLocaleString('vi-VN') + 'đ'; }
function fmtNum(n){ return Number(n).toLocaleString('vi-VN'); }

function confirmShortenAllIds(){
  const msg = 'Rút gọn toàn bộ mã hiện có (nguyên liệu, công thức nền, món) sang dạng ngắn (VD: NL-9FQ2A1)?\n\nKhông mất dữ liệu — chỉ đổi cách đặt mã, mọi liên kết (công thức nền dùng nguyên liệu nào, món dùng thành phần nào) sẽ tự cập nhật theo. Nên làm 1 lần rồi thôi.';
  if(confirm(msg)) shortenAllIds();
}
function shortenAllIds(){
  const idMap = {};
  state.ingredients.forEach(i=>{ idMap[i.id] = nextId('NL'); });
  state.semiRecipes.forEach(s=>{ idMap[s.id] = nextId('BTP'); });
  state.dishes.forEach(d=>{ idMap[d.id] = nextId('MON'); });

  state.ingredients.forEach(i=>{ i.id = idMap[i.id]; });
  state.semiRecipes.forEach(s=>{
    s.id = idMap[s.id];
    s.components.forEach(c=>{ if(idMap[c.ingredientId]) c.ingredientId = idMap[c.ingredientId]; });
  });
  state.dishes.forEach(d=>{
    d.id = idMap[d.id];
    d.components.forEach(c=>{ if(idMap[c.refId]) c.refId = idMap[c.refId]; });
  });

  toast('✅ Đã rút gọn toàn bộ mã');
  syncToCloud();
  go('ingredients');
}

function editIngredient(id){ state.editIngredientId = id; go('ingredientForm'); }

function findIngredientUsage(id){
  const semiNames = state.semiRecipes.filter(s=>s.components.some(c=>c.ingredientId===id)).map(s=>s.name);
  const dishNames = state.dishes.filter(d=>d.components.some(c=>c.type==='ingredient'&&c.refId===id)).map(d=>d.name);
  return {semiNames, dishNames};
}
function confirmDeleteIngredient(id){
  const ing = findIngredient(id);
  const usage = findIngredientUsage(id);
  const used = [...usage.semiNames.map(n=>'Công thức nền: '+n), ...usage.dishNames.map(n=>'Món: '+n)];
  let msg = `Xoá nguyên liệu "${ing.name}"?`;
  if(used.length) msg += `\n\n⚠️ Đang được dùng trong:\n- ${used.join('\n- ')}\n\nXoá sẽ tự gỡ khỏi các công thức/món trên.`;
  if(confirm(msg)) deleteIngredient(id);
}
function removeIngredientRefs(id){
  state.semiRecipes.forEach(s=>{ s.components = s.components.filter(c=>c.ingredientId!==id); });
  state.dishes.forEach(d=>{ d.components = d.components.filter(c=>!(c.type==='ingredient'&&c.refId===id)); });
}
function deleteIngredient(id){
  removeIngredientRefs(id);
  state.ingredients = state.ingredients.filter(i=>i.id!==id);
  toast('🗑️ Đã xoá nguyên liệu');
  syncToCloud();
  go('ingredients');
}
function bulkDeleteIngredients(){
  const ids = Array.from(state.selected.ingredients);
  if(!ids.length){ toast('⚠️ Chưa chọn nguyên liệu nào'); return; }
  const usedLines = ids.map(id=>{
    const ing = findIngredient(id);
    const usage = findIngredientUsage(id);
    const used = [...usage.semiNames, ...usage.dishNames];
    return used.length ? `${ing.name}: ${used.join(', ')}` : null;
  }).filter(Boolean);
  let msg = `Xoá ${ids.length} nguyên liệu đã chọn?`;
  if(usedLines.length) msg += `\n\n⚠️ Đang được dùng trong:\n- ${usedLines.join('\n- ')}\n\nXoá sẽ tự gỡ khỏi các công thức/món liên quan.`;
  if(!confirm(msg)) return;
  ids.forEach(removeIngredientRefs);
  state.ingredients = state.ingredients.filter(i=>!ids.includes(i.id));
  exitSelectMode('ingredients');
  toast(`🗑️ Đã xoá ${ids.length} nguyên liệu`);
  syncToCloud();
  go('ingredients');
}
function deleteAllIngredients(){
  if(!state.ingredients.length){ toast('Chưa có nguyên liệu nào'); return; }
  if(!confirm(`Xoá TOÀN BỘ ${state.ingredients.length} nguyên liệu?\n\nSẽ tự gỡ khỏi mọi công thức nền và món đang dùng. Không thể hoàn tác.`)) return;
  state.semiRecipes.forEach(s=>{ s.components = []; });
  state.dishes.forEach(d=>{ d.components = d.components.filter(c=>c.type!=='ingredient'); });
  state.ingredients = [];
  exitSelectMode('ingredients');
  toast('🗑️ Đã xoá toàn bộ nguyên liệu');
  syncToCloud();
  go('ingredients');
}

function saveIngredient(){
  const name = document.getElementById('f_name').value.trim();
  const packQty = parseFloat(document.getElementById('f_packQty').value);
  const priceRaw = document.getElementById('f_price').value;
  const price = parseFloat(priceRaw);
  const baseUnit = document.getElementById('f_baseUnit').value.trim();
  if(!name || !packQty || !baseUnit || priceRaw===''|| isNaN(price)){ toast('⚠️ Vui lòng nhập đủ thông tin'); return; }
  const payload = {
    name,
    group: document.getElementById('f_group').value,
    buyUnit: document.getElementById('f_buyUnit').value || '—',
    packQty, baseUnit, price
  };
  if(state.editIngredientId){
    Object.assign(findIngredient(state.editIngredientId), payload);
    toast('✅ Đã lưu thay đổi');
  } else {
    state.ingredients.push({id: nextId('NL'), ...payload});
    toast('✅ Đã lưu nguyên liệu');
  }
  state.editIngredientId = null;
  syncToCloud();
  go('ingredients');
}

      <div class="btn-row">

  } else if(w.step===3){
    body = `

      <label>Sản lượng thành phẩm thực tế thu được</label>

        <input type="number" id="w_yieldQty" value="${w.yieldQty}" placeholder="1700" style="flex:2;">

      <div class="btn-row">

  } else if(w.step===4){
    const yieldQty = parseFloat(document.getElementById && document.getElementById('w_yieldQty_hidden')?.value) || w.yieldQty;

function semiStep1Next(){

function addSemiComponent(){

function removeSemiComponent(idx){ state.wizard.components.splice(idx,1); render(); }
function semiStep2Next(){

  state.wizard.step = 3; render();
}
function semiStep3Next(){
  const yq = parseFloat(document.getElementById('w_yieldQty').value);

function saveSemi(){

/* ---------- DISH WIZARD ---------- */
function startDishWizard(editId){
  if(editId){
    const d = state.dishes.find(x=>x.id===editId);
    state.wizard = {step:1, editingId:d.id, name:d.name, components:d.components.map(c=>({...c})), opPct:d.opPct, fcPct:d.fcPct};
  } else {
    state.wizard = {step:1, editingId:null, name:'', components:[], opPct:0.15, fcPct:0.30};
  }
  go('dishWizard');
}
function dishComponentOptions(){
  const rawOpts = state.ingredients.map(i=>`<option value="ingredient:${i.id}">${i.name} (${i.baseUnit})</option>`).join('');
  const semiOpts = state.semiRecipes.map(s=>`<option value="semi:${s.id}">⭐ ${s.name} (${s.yieldUnit})</option>`).join('');
  return `<optgroup label="Bán thành phẩm">${semiOpts}</optgroup><optgroup label="Nguyên liệu thô">${rawOpts}</optgroup>`;
}
function renderDishWizard(){
  const w = state.wizard;
  const cost = w.components.reduce((s,c)=>s + c.qty*componentUnitPrice(c),0);

  let body = '';
  if(w.step===1){
    body = `
      <label>Đặt tên món</label>
      <input type="text" id="w_name" value="${w.name}" placeholder="VD: Cà phê đen đá">
      <button class="btn btn-primary" style="margin-top:22px;" onclick="dishStep1Next()">Tiếp tục</button>`;
  } else if(w.step===2){
    const list = w.components.map((c,idx)=>`
      <div class="comp-row">
        <div class="info"><div class="n">${componentName(c)}</div><div class="m">${fmtNum(c.qty)} ${componentUnit(c)} · ${fmtVND(c.qty*componentUnitPrice(c))}</div></div>
        <button class="remove" onclick="removeDishComponent(${idx})">✕</button>
      </div>`).join('');
    body = `
      <div class="card">
        <label style="margin-top:0;">Thành phần (bán thành phẩm hoặc nguyên liệu)</label>
        <select id="w_comp">${dishComponentOptions()}</select>
        <label>Định mức sử dụng</label>
        <input type="number" id="w_qty" placeholder="50">
        <button class="btn btn-outline btn-sm" style="margin-top:14px;" onclick="addDishComponent()">+ Thêm vào món</button>
      </div>
      ${list || '<div class="hint">Chưa có thành phần nào — thêm ở trên.</div>'}
      <div class="card-sub" style="margin:10px 0 4px;">Cost nguyên liệu hiện tại: <b>${fmtVND(cost)}</b></div>
      <div class="btn-row">
        <button class="btn btn-outline" onclick="wizardBack()">← Quay lại</button>
        <button class="btn btn-primary" onclick="dishStep2Next()">Tiếp tục</button>
      </div>`;
  } else if(w.step===3){
    const withOp = cost*(1+w.opPct);
    const price = w.fcPct ? Math.round((withOp/w.fcPct)/1000)*1000 : 0;
    body = `
      <div class="card"><div class="card-sub">Cost nguyên liệu</div><div class="card-title">${fmtVND(cost)}</div></div>
      <label>% Chi phí vận hành</label>
      <select id="w_opPct" class="g-select" onchange="dishSettingsPreview()">
        ${[0.10,0.15,0.20,0.25].map(v=>`<option value="${v}" ${v===w.opPct?'selected':''}>${Math.round(v*100)}%</option>`).join('')}
      </select>
      <label>% Food cost mục tiêu</label>
      <select id="w_fcPct" class="g-select" onchange="dishSettingsPreview()">
        ${[0.25,0.28,0.30,0.32,0.35].map(v=>`<option value="${v}" ${v===w.fcPct?'selected':''}>${Math.round(v*100)}%</option>`).join('')}
      </select>
      <div class="price-hero" id="pricePreview">
        <div class="lbl">Giá bán đề xuất</div>
        <div class="val">${fmtVND(price)}</div>
      </div>
      <div class="btn-row">
        <button class="btn btn-outline" onclick="wizardBack()">← Quay lại</button>
        <button class="btn btn-primary" onclick="dishStep3Next()">Xem kết quả</button>
      </div>`;
  } else if(w.step===4){
    const dishDraft = {components:w.components, opPct:w.opPct, fcPct:w.fcPct};
    const breakdown = dishBreakdown(dishDraft);
    const total = Object.values(breakdown).reduce((a,b)=>a+b,0) || 1;
    const bars = Object.entries(breakdown).map(([g,v])=>`<div style="width:${(v/total*100).toFixed(1)}%;background:${GROUP_COLORS[g]||'#ccc'};"></div>`).join('');
    const legend = Object.entries(breakdown).filter(([,v])=>v>0).map(([g,v])=>`<span><span class="dot" style="background:${GROUP_COLORS[g]||'#ccc'};"></span>${g}: ${fmtVND(v)}</span>`).join('');
    const price = suggestedPrice(dishDraft);
    const fc = actualFoodCostPct(dishDraft);
    body = `
      <div class="price-hero">
        <div class="lbl">Giá bán đề xuất</div>
        <div class="val">${fmtVND(price)}</div>
        <span class="fc-badge ${fc<=0.32?'fc-good':'fc-warn'}">Food cost ${(fc*100).toFixed(1)}%</span>
      </div>
      <div class="legend">${legend}</div>
      <div class="breakdown-bar">${bars}</div>
      <button class="btn btn-primary" onclick="saveDish()">✅ Lưu món này</button>
      <button class="btn btn-ghost" onclick="wizardBack()">← Quay lại chỉnh sửa</button>`;
  }

  return `
  <div class="screen">
    <button class="btn-ghost" onclick="wizardBack()">← ${w.step===1?'Huỷ, quay lại trang chủ':'Quay lại'}</button>
    ${wizardHead(w.step,4,'#F0A319')}
    <h1 class="page-title">${w.name || 'Món mới'}</h1>
    ${body}
  </div>`;
}
function dishStep1Next(){
  const name = document.getElementById('w_name').value.trim();
  if(!name){ toast('⚠️ Nhập tên món'); return; }
  state.wizard.name = name; state.wizard.step = 2; render();
}
function addDishComponent(){
  const raw = document.getElementById('w_comp').value;
  const qty = parseFloat(document.getElementById('w_qty').value);
  if(!qty){ toast('⚠️ Nhập định mức'); return; }
  const [type, refId] = raw.split(':');
  state.wizard.components.push({type, refId, qty});
  render();
}
function removeDishComponent(idx){ state.wizard.components.splice(idx,1); render(); }
function dishStep2Next(){
  if(state.wizard.components.length===0){ toast('⚠️ Thêm ít nhất 1 thành phần'); return; }
  state.wizard.step = 3; render();
}
function dishSettingsPreview(){
  state.wizard.opPct = parseFloat(document.getElementById('w_opPct').value);
  state.wizard.fcPct = parseFloat(document.getElementById('w_fcPct').value);
  const cost = state.wizard.components.reduce((s,c)=>s + c.qty*componentUnitPrice(c),0);
  const withOp = cost*(1+state.wizard.opPct);
  const price = state.wizard.fcPct ? Math.round((withOp/state.wizard.fcPct)/1000)*1000 : 0;
  document.getElementById('pricePreview').innerHTML = `<div class="lbl">Giá bán đề xuất</div><div class="val">${fmtVND(price)}</div>`;
}
function dishStep3Next(){ state.wizard.step = 4; render(); }
function saveDish(){
  const w = state.wizard;
  const wasEditing = w.editingId;
  if(wasEditing){
    const d = state.dishes.find(x=>x.id===wasEditing);
    Object.assign(d, {name:w.name, components:w.components, opPct:w.opPct, fcPct:w.fcPct});
    toast('✅ Đã lưu thay đổi món');
  } else {
    state.dishes.push({id: nextId('MON'), name:w.name, components:w.components, opPct:w.opPct, fcPct:w.fcPct});
    toast('✅ Đã lưu món');
  }
  syncToCloud();
  state.wizard = null;
  if(wasEditing) go('dishDetail',{selectedDishId:wasEditing});
  else go('menu');
}

function wizardBack(){
  if(state.wizard.step>1){ state.wizard.step--; render(); return; }
  const editingId = state.wizard.editingId;
  const wasDish = state.screen==='dishWizard';
  state.wizard = null;
  if(editingId && wasDish) go('dishDetail',{selectedDishId:editingId});
  else go(wasDish?'home':'semiList');
}
function wizardHead(step,total,color){
  const dots = Array.from({length:total}).map((_,i)=>`<div class="step-dot ${i<step?'done':''}"></div>`).join('');
  const pct = Math.min(100, Math.round(step/total*100));
  return `
  <div class="wizard-head">
    <svg class="cup" viewBox="0 0 40 48" fill="none">
      <path d="M6 12h28l-4 32a4 4 0 0 1-4 3.6H14A4 4 0 0 1 10 44Z" fill="#fff" stroke="#33281A" stroke-width="2.4"/>
      <clipPath id="cupclip"><path d="M6 12h28l-4 32a4 4 0 0 1-4 3.6H14A4 4 0 0 1 10 44Z"/></clipPath>
      <rect x="4" y="${47-(pct*0.32)}" width="32" height="40" fill="${color}" clip-path="url(#cupclip)"/>
      <rect x="3" y="9" width="34" height="4.5" rx="2.2" fill="#33281A"/>
    </svg>
    <div class="steps-row">${dots}</div>
  </div>
  <div class="step-label">Bước ${step}/${total}</div>`;
}

    ${sel ? '' : `<button class="btn btn-primary" style="margin-bottom:16px;" onclick="startDishWizard()">+ Tính giá món mới</button>`}

      <button class="btn btn-outline btn-sm" onclick="toggleSelectMode('dishes')">${sel?'Huỷ chọn':'☑️ Chọn nhiều'}</button>

    </div>
    ${rows}

  ${selectBar('dishes', state.dishes.map(d=>d.id))}`;

function renderDishDetail(){
  const d = state.dishes.find(x=>x.id===state.selectedDishId);
  if(!d) return `<div class="screen"><button class="btn-ghost" onclick="go('menu')">← Menu</button><div class="empty-state">Không tìm thấy món.</div></div>`;
  const breakdown = dishBreakdown(d);
  const total = Object.values(breakdown).reduce((a,b)=>a+b,0) || 1;
  const bars = Object.entries(breakdown).map(([g,v])=>`<div style="width:${(v/total*100).toFixed(1)}%;background:${GROUP_COLORS[g]||'#ccc'};"></div>`).join('');
  const legend = Object.entries(breakdown).filter(([,v])=>v>0).map(([g,v])=>`<span><span class="dot" style="background:${GROUP_COLORS[g]||'#ccc'};"></span>${g}: ${fmtVND(v)}</span>`).join('');
  const compRows = d.components.map(c=>`
    <div class="comp-row">
      <div class="info"><div class="n">${componentName(c)}</div><div class="m">${fmtNum(c.qty)} ${componentUnit(c)}</div></div>
      <div class="card-value" style="font-size:14px;">${fmtVND(c.qty*componentUnitPrice(c))}</div>
    </div>`).join('');
  const fc = actualFoodCostPct(d);
  return `
  <div class="screen">
    <button class="btn-ghost" onclick="go('menu')">← Menu</button>
    <h1 class="page-title">${d.name}</h1>
    <div class="price-hero">
      <div class="lbl">Giá bán đề xuất</div>
      <div class="val">${fmtVND(suggestedPrice(d))}</div>
      <span class="fc-badge ${fc<=0.32?'fc-good':'fc-warn'}">Food cost ${(fc*100).toFixed(1)}%</span>
    </div>
    <div class="legend">${legend}</div>
    <div class="breakdown-bar">${bars}</div>
    <label style="margin-top:22px;">Thành phần</label>
    ${compRows}
    <button class="btn btn-outline" style="margin-top:18px;" onclick="startDishWizard('${d.id}')">✏️ Sửa món này</button>
    <button class="btn btn-danger" style="margin-top:10px;" onclick="confirmDeleteDish('${d.id}')">Xoá món này</button>
  </div>`;
}
function confirmDeleteDish(id){
  const d = state.dishes.find(x=>x.id===id);
  if(confirm(`Xoá món "${d.name}"?`)) deleteDish(id);
}
function deleteDish(id){
  state.dishes = state.dishes.filter(d=>d.id!==id);
  toast('🗑️ Đã xoá món');
  syncToCloud();
  go('menu');
}
function bulkDeleteDishes(){
  const ids = Array.from(state.selected.dishes);
  if(!ids.length){ toast('⚠️ Chưa chọn món nào'); return; }
  if(!confirm(`Xoá ${ids.length} món đã chọn?`)) return;
  state.dishes = state.dishes.filter(d=>!ids.includes(d.id));
  exitSelectMode('dishes');
  toast(`🗑️ Đã xoá ${ids.length} món`);
  syncToCloud();
  go('menu');
}
function deleteAllDishes(){
  if(!state.dishes.length){ toast('Chưa có món nào'); return; }
  if(!confirm(`Xoá TOÀN BỘ ${state.dishes.length} món trong menu? Không thể hoàn tác.`)) return;
  state.dishes = [];
  exitSelectMode('dishes');
  toast('🗑️ Đã xoá toàn bộ menu');
  syncToCloud();
  go('menu');
}
function bulkDelete(list){
  if(list==='ingredients') bulkDeleteIngredients();
  else if(list==='semi') bulkDeleteSemi();
  else if(list==='dishes') bulkDeleteDishes();
}

function renderAdminTopbar(){

}
function renderAdminLogin(){
  return `
  <div class="login-wrap">
    <h1>🔧 Trang quản trị</h1>

    <label style="text-align:left;">Mã quản trị</label>
    <input type="password" id="adminKeyInput" placeholder="••••••••" onkeydown="if(event.key==='Enter') adminLogin()">

async function adminLogin(){
  if(MHKL_DEMO){ toast('⚠️ Chưa nối Apps Script (xem SETUP.md phần B)'); return; }
  const key = document.getElementById('adminKeyInput').value;
  if(!key){ toast('⚠️ Nhập mã quản trị'); return; }
  showFullLoading('Đang kiểm tra...');
  try{
    const res = await callAppsScript({action:'admin_list', adminKey:key});
    if(!res.ok){ hideFullLoading(); toast('⚠️ '+(res.error||'Sai mã quản trị')); return; }
    state.adminKey = key;
    state.adminAccounts = res.accounts;
    const gRes = await callAppsScript({action:'admin_google_list', adminKey:key});
    if(gRes.ok) state.adminGoogle = {approved:gRes.approved, pending:gRes.pending};
    hideFullLoading();
    state.adminTab = 'students';
    go('adminHome');
  }catch(e){
    hideFullLoading();
    toast('⚠️ Lỗi kết nối máy chủ');
  }
}
function adminLogout(){
  state.adminKey = null; state.adminAccounts = []; state.adminGoogle = {approved:[],pending:[]};
  state.adminEditingUsername = null; state.adminRevealed = new Set();
  window.location.hash = '';
  location.reload();
}
async function refreshAdminAccounts(){
  const res = await callAppsScript({action:'admin_list', adminKey: state.adminKey});
  if(res.ok) state.adminAccounts = res.accounts;
}
async function refreshAdminGoogle(){
  const res = await callAppsScript({action:'admin_google_list', adminKey: state.adminKey});
  if(res.ok) state.adminGoogle = {approved:res.approved, pending:res.pending};
}

function renderAdminHome(){

      <button class="btn ${tab==='google'?'btn-primary':'btn-outline'} btn-sm" onclick="switchAdminTab('google')">Đăng nhập Google</button>
    </div>
    ${tab==='students' ? renderAdminStudentsTab() : renderAdminGoogleTab()}
    <button class="btn-ghost" style="margin-top:20px;" onclick="adminLogout()">Thoát khỏi trang quản trị</button>

}
function switchAdminTab(tab){ state.adminTab = tab; state.adminEditingUsername = null; render(); }

/* ---- tab: mã học viên ---- */
function renderAdminStudentsTab(){
  const accs = state.adminAccounts || [];
  const editing = state.adminEditingUsername ? accs.find(a=>a.username===state.adminEditingUsername) : null;
  const rows = accs.map(a=>{
    const revealed = state.adminRevealed.has(a.username);
    return `
    <div class="card">
      <div class="card-row">
        <div style="flex:1;">
          <div class="card-title">${a.username}</div>
          <div class="card-sub">${a.displayName || '(chưa đặt tên)'} · tạo ${a.createdAt ? new Date(a.createdAt).toLocaleDateString('vi-VN') : '—'}</div>
          <div class="card-sub" style="margin-top:4px;">
            Mật khẩu: ${revealed ? `<b>${a.password || '(không có)'}</b>` : '••••••••'}
            <button class="icon-btn" style="width:26px;height:26px;font-size:12px;margin-left:6px;" onclick="toggleRevealPassword('${a.username}')" title="${revealed?'Ẩn':'Xem'}">${revealed?'🙈':'👁'}</button>
          </div>
        </div>
        <div class="card-actions-row">
          <button class="icon-btn" onclick="startEditAccount('${a.username}')" title="Sửa">✏️</button>
          <button class="icon-btn icon-btn-danger" onclick="confirmDeleteAccount('${a.username}')" title="Xoá">🗑️</button>
        </div>
      </div>
    </div>`;
  }).join('') || `<div class="empty-state">Chưa có tài khoản học viên nào</div>`;

  return `
    <p class="page-sub">${editing ? 'Sửa thông tin tài khoản — để trống mật khẩu nếu không muốn đổi.' : 'Điền thông tin rồi bấm tạo — hệ thống tự tạo 1 Google Sheet dữ liệu riêng cho học viên đó.'}</p>
    <div class="card">
      <label style="margin-top:0;">Mã học viên</label>
      <input type="text" id="a_username" placeholder="VD: HV2026-015" value="${editing?editing.username:''}" ${editing?'disabled style="background:var(--cream-deep);"':''}>
      <label>${editing?'Mật khẩu mới (bỏ trống nếu giữ nguyên)':'Mật khẩu tạm'}</label>
      <input type="text" id="a_password" placeholder="${editing?'••••••••':'VD: trada2026'}" value="${editing?'':''}">
      <label>Tên học viên</label>
      <input type="text" id="a_name" placeholder="Nguyễn Thị A" value="${editing?(editing.displayName||''):''}">
      <div class="btn-row" style="margin-top:16px;">
        ${editing?`<button class="btn btn-outline" onclick="cancelEditAccount()">Huỷ</button>`:''}
        <button class="btn btn-primary" onclick="adminSaveAccount()">${editing?'Lưu thay đổi':'+ Tạo tài khoản'}</button>
      </div>
    </div>
    <label>Đã tạo (${accs.length})</label>
    ${rows}`;
}
function toggleRevealPassword(username){
  if(state.adminRevealed.has(username)) state.adminRevealed.delete(username);
  else state.adminRevealed.add(username);
  render();
}
function startEditAccount(username){ state.adminEditingUsername = username; render(); }
function cancelEditAccount(){ state.adminEditingUsername = null; render(); }
async function adminSaveAccount(){
  const editing = state.adminEditingUsername;
  const password = document.getElementById('a_password').value;
  const displayName = document.getElementById('a_name').value.trim();
  if(editing){
    showFullLoading('Đang lưu...');
    try{
      const res = await callAppsScript({action:'admin_update', adminKey: state.adminKey, username: editing, newPassword: password || undefined, newDisplayName: displayName});
      hideFullLoading();
      if(!res.ok){ toast('⚠️ '+(res.error||'Lưu thất bại')); return; }
      toast('✅ Đã lưu thay đổi');
      state.adminEditingUsername = null;
      await refreshAdminAccounts();
      go('adminHome');
    }catch(e){ hideFullLoading(); toast('⚠️ Lỗi kết nối máy chủ'); }
    return;
  }
  const username = document.getElementById('a_username').value.trim();
  if(!username || !password){ toast('⚠️ Nhập đủ mã học viên và mật khẩu'); return; }
  showFullLoading('Đang tạo tài khoản...');
  try{
    const res = await callAppsScript({action:'admin_create', adminKey: state.adminKey, username, password, displayName});
    hideFullLoading();
    if(!res.ok){ toast('⚠️ '+(res.error||'Tạo thất bại')); return; }
    toast(`✅ Đã tạo tài khoản ${username} — gửi mã + mật khẩu cho học viên`);
    await refreshAdminAccounts();
    go('adminHome');
  }catch(e){
    hideFullLoading();
    toast('⚠️ Lỗi kết nối máy chủ');
  }
}
function confirmDeleteAccount(username){
  if(confirm(`Xoá tài khoản "${username}"?\n\nSẽ xoá luôn Google Sheet dữ liệu riêng của học viên này (chuyển vào Thùng rác Drive). Không thể hoàn tác qua app.`)){
    adminDeleteAccount(username);
  }
}
async function adminDeleteAccount(username){
  showFullLoading('Đang xoá...');
  try{
    const res = await callAppsScript({action:'admin_delete', adminKey: state.adminKey, username});
    hideFullLoading();
    if(!res.ok){ toast('⚠️ '+(res.error||'Xoá thất bại')); return; }
    toast('🗑️ Đã xoá tài khoản');
    await refreshAdminAccounts();
    go('adminHome');
  }catch(e){ hideFullLoading(); toast('⚠️ Lỗi kết nối máy chủ'); }
}

/* ---- tab: duyệt đăng nhập Google ---- */
function renderAdminGoogleTab(){
  const g = state.adminGoogle || {approved:[],pending:[]};
  const pendingRows = g.pending.map(p=>`
    <div class="card">
      <div class="card-row">
        <div>
          <div class="card-title">${p.email}</div>
          <div class="card-sub">Thử đăng nhập lúc ${p.lastSeenAt ? new Date(p.lastSeenAt).toLocaleString('vi-VN') : '—'}</div>
        </div>
        <button class="btn btn-primary btn-sm" onclick="adminApproveGoogle('${p.email}')">✅ Duyệt</button>
      </div>
    </div>`).join('') || `<div class="empty-state" style="padding:24px;">Chưa có ai đang chờ duyệt</div>`;
  const approvedRows = g.approved.map(a=>`
    <div class="card">
      <div class="card-row">
        <div>
          <div class="card-title">${a.email}</div>
          <div class="card-sub">${a.displayName||''} · duyệt ${a.approvedAt ? new Date(a.approvedAt).toLocaleDateString('vi-VN') : '—'}</div>
        </div>
        <button class="icon-btn icon-btn-danger" onclick="confirmRevokeGoogle('${a.email}')" title="Thu hồi quyền">🗑️</button>
      </div>
    </div>`).join('') || `<div class="empty-state" style="padding:24px;">Chưa duyệt email nào</div>`;

  return `
    <p class="page-sub">Chỉ email Google đã duyệt mới đăng nhập được vào app. Người khác bấm "Đăng nhập bằng Google" sẽ vào hàng chờ bên dưới, KHÔNG được tạo/xem dữ liệu cho tới khi bạn duyệt.</p>
    <div class="card">
      <label style="margin-top:0;">Duyệt trước 1 email (không cần họ thử đăng nhập trước)</label>
      <input type="text" id="g_email" placeholder="ten@gmail.com">
      <label>Tên (tuỳ chọn)</label>
      <input type="text" id="g_name" placeholder="Nguyễn Thị A">
      <button class="btn btn-primary btn-sm" style="margin-top:12px;" onclick="adminApproveGoogle(null)">✅ Duyệt email này</button>
    </div>
    <label>Đang chờ duyệt (${g.pending.length})</label>
    ${pendingRows}
    <label style="margin-top:18px;">Đã duyệt (${g.approved.length})</label>
    ${approvedRows}`;
}
async function adminApproveGoogle(emailArg){
  const email = emailArg || document.getElementById('g_email').value.trim();
  const displayName = emailArg ? '' : document.getElementById('g_name').value.trim();
  if(!email){ toast('⚠️ Nhập email cần duyệt'); return; }
  showFullLoading('Đang duyệt...');
  try{
    const res = await callAppsScript({action:'admin_google_approve', adminKey: state.adminKey, email, displayName});
    hideFullLoading();
    if(!res.ok){ toast('⚠️ '+(res.error||'Duyệt thất bại')); return; }
    toast(`✅ Đã duyệt ${email}`);
    await refreshAdminGoogle();
    go('adminHome');
  }catch(e){ hideFullLoading(); toast('⚠️ Lỗi kết nối máy chủ'); }
}
function confirmRevokeGoogle(email){
  if(confirm(`Thu hồi quyền truy cập của "${email}"?\n\nLưu ý: nếu người này đang có phiên còn hiệu lực trong trình duyệt, họ vẫn dùng được tới khi phiên đó hết hạn/đăng xuất.`)){
    adminRevokeGoogle(email);
  }
}
async function adminRevokeGoogle(email){
  showFullLoading('Đang thu hồi...');
  try{
    const res = await callAppsScript({action:'admin_google_revoke', adminKey: state.adminKey, email});
    hideFullLoading();
    if(!res.ok){ toast('⚠️ '+(res.error||'Thất bại')); return; }
    toast('✅ Đã thu hồi quyền');
    await refreshAdminGoogle();
    go('adminHome');
  }catch(e){ hideFullLoading(); toast('⚠️ Lỗi kết nối máy chủ'); }
}

const IS_ADMIN_ROUTE = window.location.hash === '#admin';
if(IS_ADMIN_ROUTE) state.screen = 'adminLogin';

render();
if(!IS_ADMIN_ROUTE){
  window.addEventListener('load', async ()=>{
    initGoogleAuth();
    await tryRestoreSession();
  });
}

// Gõ/xoá #admin trên thanh địa chỉ rồi bấm Enter chỉ đổi hash, KHÔNG tự tải lại
// trang (cùng URL gốc) — nếu không bắt sự kiện này, app phải chờ hard refresh
// mới nhận ra và chuyển đúng màn.
window.addEventListener('hashchange', ()=>{
  location.reload();
});
</script>
